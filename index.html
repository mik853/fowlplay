<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOWLPLAY - NFT Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyan: #7FDBFF;
            --dark-cyan: #39CCCC;
            --orange: #FF851B;
            --yellow: #FFDC00;
            --red: #FF4136;
            --navy: #001f3f;
            --white: #FFFFFF;
            --light-gray: #F0F4F8;
            --green: #2ECC40;
            --light-green: #01FF70;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--dark-cyan) 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Landing Page */
        #landing-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #landing-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 220, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 133, 27, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, 30px) rotate(5deg); }
        }

        .character-container {
            position: relative;
            z-index: 2;
            animation: bounceIn 1s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .character-image {
            width: 300px;
            height: 300px;
            filter: drop-shadow(0 20px 40px rgba(0, 31, 63, 0.3));
            animation: wiggle 3s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .halo-glow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--yellow) 0%, transparent 70%);
            opacity: 0.5;
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(0.9); }
            50% { opacity: 0.6; transform: translateX(-50%) scale(1.1); }
        }

        .enter-button {
            margin-top: 60px;
            padding: 20px 80px;
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            letter-spacing: 8px;
            color: var(--white);
            background: linear-gradient(135deg, var(--orange) 0%, var(--red) 100%);
            border: 4px solid var(--yellow);
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
            box-shadow: 
                0 10px 30px rgba(255, 133, 27, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 
                0 10px 30px rgba(255, 133, 27, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                0 0 20px rgba(255, 220, 0, 0.3); 
            }
            50% { box-shadow: 
                0 10px 30px rgba(255, 133, 27, 0.6),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                0 0 40px rgba(255, 220, 0, 0.6); 
            }
        }

        .enter-button:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 
                0 15px 40px rgba(255, 133, 27, 0.6),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                0 0 50px rgba(255, 220, 0, 0.8);
        }

        .enter-button:active {
            transform: scale(1.05) rotate(0deg);
        }

        /* Loading Screen */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--navy) 0%, #003366 100%);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #loading-screen.active {
            display: flex;
        }

        .crt-effect {
            position: relative;
            width: 80%;
            max-width: 600px;
            aspect-ratio: 4/3;
            background: linear-gradient(to bottom, #e0e0e0 0%, #f5f5f5 50%, #e0e0e0 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 0 0 15px rgba(50, 50, 50, 0.8),
                0 30px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .crt-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 0, 0, 0.05) 3px
            );
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        .loading-text {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: var(--orange);
            text-transform: uppercase;
            letter-spacing: 6px;
            animation: blink 1.5s steps(2, start) infinite;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Main Content */
        #main-content {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
        }

        #main-content.active {
            display: block;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            color: var(--white);
            text-shadow: 
                4px 4px 0 var(--orange),
                8px 8px 0 var(--yellow),
                12px 12px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .tagline {
            font-size: 1.3rem;
            color: var(--yellow);
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Wallet Checker Section */
        .section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 
                0 20px 60px rgba(0, 31, 63, 0.2),
                0 0 0 4px var(--yellow);
            animation: slideUp 0.8s ease-out backwards;
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 220, 0, 0.2), transparent);
            transition: left 0.5s;
        }

        .section:hover::before {
            left: 100%;
        }

        .section:nth-child(1) { animation-delay: 0.2s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: var(--navy);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-icon {
            font-size: 2.5rem;
        }

        .section-subtitle {
            font-size: 1rem;
            color: #555;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            border: 3px solid var(--cyan);
            border-radius: 15px;
            transition: all 0.3s ease;
            background: white;
        }

        .input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(255, 133, 27, 0.2);
            transform: scale(1.02);
        }

        .button {
            padding: 15px 40px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: white;
            background: linear-gradient(135deg, var(--orange) 0%, var(--red) 100%);
            border: 3px solid var(--yellow);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 133, 27, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            width: 100%;
        }

        .button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(255, 133, 27, 0.5);
        }

        .button:active {
            transform: translateY(-1px) scale(1.02);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Box */
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 25px 30px;
            border-radius: 20px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Guaranteed */
        .result-box.guaranteed {
            background: linear-gradient(135deg, #e8fdf0, #d4f8e4);
            border: 3px solid var(--green);
        }
        .result-box.guaranteed .result-title { color: #1a7a3c; }
        .result-box.guaranteed .result-message { color: #1a5c2e; }

        /* FCFS */
        .result-box.fcfs {
            background: linear-gradient(135deg, #fff8e1, #fff0b3);
            border: 3px solid var(--orange);
        }
        .result-box.fcfs .result-title { color: #b85c00; }
        .result-box.fcfs .result-message { color: #7a4000; }

        /* Role badge */
        .role-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 18px;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .guaranteed .role-badge {
            background: var(--green);
            color: white;
        }
        .fcfs .role-badge {
            background: var(--orange);
            color: white;
        }

        /* Ineligible */
        .result-box.ineligible {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 3px solid #444;
        }
        .result-box.ineligible .result-title { color: var(--yellow); }
        .result-box.ineligible .result-message { color: #ccc; }

        /* Error */
        .result-box.error {
            background: linear-gradient(135deg, #fff3cd, #ffe69c);
            border: 3px solid var(--orange);
        }
        .result-box.error .result-title { color: var(--orange); }
        .result-box.error .result-message { color: #7a5200; }

        .result-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }

        .result-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .result-message {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.6;
        }

        /* Checking state */
        .checking-spinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .checking-spinner.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 31, 63, 0.1);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .checking-text {
            font-family: 'Fredoka One', cursive;
            color: var(--navy);
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* X / Twitter Button */
        .x-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 55px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transition: all 0.3s ease;
            text-decoration: none;
            border: 3px solid var(--yellow);
        }

        .x-button:hover {
            transform: scale(1.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 220, 0, 0.4);
        }

        .x-button svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo { font-size: 2.5rem; }
            .enter-button { 
                font-size: 1.8rem; 
                padding: 15px 50px;
                letter-spacing: 4px;
            }
            .character-image { width: 200px; height: 200px; }
            .section { padding: 25px; }
            .section-title { font-size: 1.5rem; }
            .loading-text { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- X / Twitter Button -->
    <a href="https://twitter.com/fowlplay_eth" target="_blank" class="x-button" title="Follow us on X">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
    </a>

    <!-- Landing Page -->
    <div id="landing-page">
        <div class="character-container">
            <div class="halo-glow"></div>
            <img src="fowlplay-character.jpg" alt="Fowlplay Character" class="character-image">
        </div>
        <button class="enter-button" onclick="enterSite()">ENTER</button>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="crt-effect">
            <div class="loading-text">ENTERING..</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="container">
            <div class="header">
                <h1 class="logo">FOWLPLAY</h1>
                <p class="tagline">Join the Flock! 🐔</p>
            </div>

            <!-- Wallet Checker Section -->
            <div class="section">
                <h2 class="section-title">
                    <span class="section-icon">🔍</span>
                    Check Wallet Eligibility
                </h2>
                <p class="section-subtitle">Enter your Ethereum wallet address to see if you're on the whitelist.</p>

                <div class="input-group">
                    <label class="label">Wallet Address</label>
                    <input type="text" id="wallet-input" class="input" placeholder="0x..." autocomplete="off" spellcheck="false">
                </div>

                <button class="button" id="check-btn" onclick="checkWallet()">Check Eligibility</button>

                <!-- Spinner -->
                <div class="checking-spinner" id="spinner">
                    <div class="spinner"></div>
                    <p class="checking-text">CHECKING THE FLOCK...</p>
                </div>

                <!-- Result -->
                <div class="result-box" id="result-box">
                    <span class="result-icon" id="result-icon"></span>
                    <p class="result-title" id="result-title"></p>
                    <p class="result-message" id="result-message"></p>
                    <span class="role-badge" id="role-badge" style="display:none;"></span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ===========================================
        // CONFIGURATION — EDIT THIS
        // ===========================================
        const CONFIG = {
            // Paste your deployed Google Apps Script Web App URL here
            APPS_SCRIPT_URL: 'YOUR_APPS_SCRIPT_URL_HERE'
        };
        // ===========================================

        function enterSite() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('loading-screen').classList.add('active');
            
            setTimeout(() => {
                document.getElementById('loading-screen').classList.remove('active');
                document.getElementById('main-content').classList.add('active');
            }, 2000);
        }

        async function checkWallet() {
            const walletInput = document.getElementById('wallet-input').value.trim();
            const btn = document.getElementById('check-btn');
            const spinner = document.getElementById('spinner');
            const resultBox = document.getElementById('result-box');

            // Basic validation
            if (!walletInput) {
                showResult('error', '⚠️', 'Hold Up', 'Please enter a wallet address first.');
                return;
            }

            if (!walletInput.match(/^0x[a-fA-F0-9]{40}$/)) {
                showResult('error', '⚠️', 'Invalid Address', 'That doesn\'t look like a valid Ethereum address. Double-check and try again.');
                return;
            }

            // Show loading state
            btn.disabled = true;
            resultBox.style.display = 'none';
            spinner.classList.add('active');

            try {
                const response = await fetch(`${https://script.google.com/macros/s/AKfycbzb82diarkf72bFaaaLhiidYyIf1LS2f_QvWiIOfQZvZEcPZ-QcTgLLKBuyPgepfS6M5A/exec}?wallet=${encodeURIComponent(walletInput.toLowerCase())}`, {
                    method: 'GET',
                });

                const data = await response.json();

                spinner.classList.remove('active');

                if (data.eligible === true && data.role === 'guaranteed') {
                        showResult('guaranteed', '✅', 'You\'re In', 'The flock recognizes you. Your wallet has been cleared. You\'re in.', 'Guaranteed');
                    } else if (data.eligible === true && data.role === 'fcfs') {
                        showResult('fcfs', '🎟️', 'You\'re In', 'The flock recognizes you. Your wallet has been cleared. You\'re in.', 'First Come First Served');
                    } else {
                        showResult('ineligible', '🐦‍⬛', 'Not Listed', 'This wallet walks alone. You\'re not on the list yet. The game isn\'t over.', null);
                    }

            } catch (err) {
                spinner.classList.remove('active');
                showResult('error', '⚠️', 'Something Went Wrong', 'Could not reach the server. Check your connection and try again.');
            }

            btn.disabled = false;
        }

        function showResult(type, icon, title, message, badge) {
            const resultBox = document.getElementById('result-box');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');
            const roleBadge = document.getElementById('role-badge');

            resultBox.className = `result-box ${type}`;
            resultIcon.textContent = icon;
            resultTitle.textContent = title;
            resultMessage.textContent = message;

            if (badge) {
                roleBadge.textContent = badge;
                roleBadge.style.display = 'inline-block';
            } else {
                roleBadge.style.display = 'none';
            }

            resultBox.style.display = 'block';
        }

        // Allow Enter key to trigger check
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('wallet-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkWallet();
            });
        });
    </script>

</body>
</html>
